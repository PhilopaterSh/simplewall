[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldfish-gate"
version = "0.2.0"
description = "Machine-checked traceability between an approved design and spec-driven execution: the Elephant-Goldfish Model to Spec Kit handoff gate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PhilopaterSh" }]
keywords = [
  "spec-driven-development",
  "requirements-traceability",
  "ai-agents",
  "spec-kit",
  "elephant-goldfish-model",
  "ci",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
goldfish = "goldfish_gate.cli:main"

[tool.setuptools]
packages = ["goldfish_gate"]
