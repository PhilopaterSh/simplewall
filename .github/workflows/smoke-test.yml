name: smoke-test

# Hardened fork verification: build + launch + lifetime check
# Runs on push to feat branches (windows runner = admin, no UAC, no SAC)

on:
  push:
    branches: [feat/routine-hardening, feat/hardening-round-1, master, feat/tooling]
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # process gates (process-audit roadmap items 1-2): mechanical
      # traceability (goldfish check) + artifact completeness for every
      # spec chain — a chain that passes while carrying template files or
      # missing verification records must fail CI, not rely on discipline
      - name: Chain gates (goldfish check + artifact completeness)
        shell: pwsh
        run: |
          pip install tools/vendor/goldfish-gate-pin
          $failed = $false
          Get-ChildItem docs/specs -Directory | Where-Object { Test-Path "$($_.FullName)/design.md" } | ForEach-Object {
            Push-Location $_.FullName
            goldfish check design.md spec.md plan.md tasks.md
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Pop-Location
          }
          python tools/check-chain-artifacts.py docs/specs
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { Write-Error 'chain gates failed'; exit 1 }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore CppWinRT
        shell: cmd
        run: |
          curl -L -o nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
          nuget.exe install Microsoft.Windows.CppWinRT -Version 2.0.230706.1 -OutputDirectory packages -NonInteractive -Source https://api.nuget.org/v3/index.json

      - name: Build (Release x64)
        shell: cmd
        run: msbuild simplewall.vcxproj -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -p:WindowsTargetPlatformVersion=10.0 -p:TreatWarningAsError=false -m -nologo -v:m

      # tooling round r3 (DEC-08/DEC-10): build the C tool suite - no
      # NuGet needed (no CppWinRT coupling), same v143 override
      - name: Build tool suite (Release x64)
        shell: cmd
        run: |
          msbuild tools\preflight.vcxproj -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -p:WindowsTargetPlatformVersion=10.0 -p:TreatWarningAsError=false -m -nologo -v:m
          msbuild tools\dnsrig.vcxproj -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -p:WindowsTargetPlatformVersion=10.0 -p:TreatWarningAsError=false -m -nologo -v:m
          msbuild tools\feedserver.vcxproj -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -p:WindowsTargetPlatformVersion=10.0 -p:TreatWarningAsError=false -m -nologo -v:m

      - name: Verify exe exists
        shell: pwsh
        run: |
          $exe = 'bin/64/simplewall.exe'
          if (-not (Test-Path $exe)) { Write-Error 'exe missing'; exit 1 }
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "exe OK: $((Get-Item $exe).Length) bytes, SHA256=$h"
          "sha256=$h" | Out-File -Encoding utf8 exe-hash.txt

      - name: Smoke test - launch and lifetime
        shell: pwsh
        run: |
          # runners run elevated: WFP app launches without relaunch
          $p = Start-Process -FilePath 'bin/64/simplewall.exe' -PassThru
          Start-Sleep 20
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if ($alive) {
            Write-Host "PASS: simplewall alive after 20s (PID $($p.Id))"
            "result=PASS" | Out-File -Encoding utf8 smoke-result.txt
          } else {
            Write-Host "FAIL: simplewall exited within 20s (exit code 0x$($p.ExitCode.ToString('X')))"
            "result=FAIL" | Out-File -Encoding utf8 smoke-result.txt
          }

      - name: Smoke test - config and log collection
        shell: pwsh
        run: |
          Start-Sleep 5
          $dirs = @("$env:APPDATA\simplewall", "$env:LOCALAPPDATA\simplewall", "$env:USERPROFILE\Desktop\simplewall_crash")
          $out = 'smoke-artifacts'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          foreach ($d in $dirs) {
            if (Test-Path $d) { Copy-Item $d -Destination "$out/$(Split-Path $d -Leaf)" -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-ChildItem $out -Recurse | Select-Object FullName, Length | Out-File -Encoding utf8 "$out/inventory.txt"

      - name: Stop app
        if: always()
        shell: pwsh
        run: Stop-Process -Name simplewall -Force -ErrorAction SilentlyContinue

      # tooling round (FR-05): REQUIRED preflight gate — CI profile skips the
      # release-authoritative checks (Authenticode: runner builds are unsigned;
      # off-repo key JSON: never leaves the owner machine — DEC-05/DEC-07)
      - name: Release preflight (CI profile, C tool)
        shell: pwsh
        run: bin/64/preflight.exe bin/64/simplewall.exe --ci --json | Tee-Object -FilePath preflight.json

      # tooling round (FR-04): DNS rig loopback self-test — no sandbox needed
      - name: DNS rig self-test (C tool)
        shell: pwsh
        run: bin/64/dnsrig.exe -selftest

      # composite GUI chain G-2 (NFR-06/r4): the six DEC-11 query-API
      # enumerators verified INSIDE the real binary (fixtures via the real
      # serializer; REAL threadpool-timer expiry). Exit code = failure count.
      - name: Composite selftest (query APIs, -gui-selftest)
        shell: pwsh
        run: |
          # crash evidence: full LocalDumps for simplewall.exe (the selftest
          # fastfailed 0xC0000409 in the first CI run before any flush)
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\dumps" -Force | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\simplewall.exe" /v DumpFolder /t REG_EXPAND_SZ /d "$env:GITHUB_WORKSPACE\dumps" /f | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\simplewall.exe" /v DumpType /t REG_DWORD /d 2 /f | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\simplewall.exe" /v DumpCount /t REG_DWORD /d 3 /f | Out-Null
          # portable posture (2026-11-20): the freeze chain runs through
          # the APPDATA profile path (SHGetKnownFolderPath + the config
          # "false" entry pool) - the portable model (marker file beside
          # the exe) bypasses that path entirely; the composite portable-
          # skip in hardenacl already covers this case
          New-Item -ItemType File -Path "bin/64/portable.dat" -Force | Out-Null
          # watchdog: the first post-fix run HUNG in _app_initialize (modal
          # dialog on a fresh runner profile?) - turn any hang into
          # screenshot evidence instead of a 30-minute stall
          $p = Start-Process -FilePath "bin/64/simplewall.exe" -ArgumentList '-gui-selftest' -PassThru
          $deadline = (Get-Date).AddSeconds(75)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (-not $p.HasExited) {
            Write-Host 'HANG: selftest still running after 75s - dumping + desktop evidence'
            New-Item -ItemType Directory -Path "dumps" -Force | Out-Null
            # system-built-in dump (no procdump dependency): the hanging
            # stack IS the answer
            Start-Process -FilePath rundll32.exe -ArgumentList "C:\Windows\System32\comsvcs.dll, MiniDump $($p.Id) $env:GITHUB_WORKSPACE\dumps\selftest-hang.dmp full" -Wait -NoNewWindow
            Add-Type -AssemblyName System.Drawing
            Add-Type -AssemblyName System.Windows.Forms
            $sw = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width
            $sh = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height
            $bmp = New-Object System.Drawing.Bitmap($sw, $sh)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen(0, 0, 0, 0, (New-Object System.Drawing.Size($sw, $sh)))
            $g.Dispose()
            $bmp.Save("gui-screens-selftest-hang.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host '--- breadcrumbs (stage trace):'
            if (Test-Path bin/64/breadcrumb.txt) { Get-Content bin/64/breadcrumb.txt } else { Write-Host 'NO breadcrumb.txt — hung BEFORE init:enter' }
            Write-Error 'selftest hung (dump at dumps/selftest-hang.dmp)'; exit 1
          }
          $code = $p.ExitCode
          Write-Host "selftest process exit code: $code (0xC0000409 = -1073740791 = fail-fast)"
          if (Test-Path bin/64/selftest-result.txt) { Get-Content bin/64/selftest-result.txt }
          else { Write-Host 'FAIL: selftest-result.txt was not produced (process died before any flush)'; if (-not $code) { $code = 99 } }
          if ($code -ne 0) { Write-Error "composite selftest failed (exit=$code)"; exit 1 }
          # collect the app's own SEH dumps (Desktop\simplewall_crash) +
          # the symbolized crash report (crash-report.txt) when present
          if (Test-Path "$env:USERPROFILE\Desktop\simplewall_crash") { Copy-Item "$env:USERPROFILE\Desktop\simplewall_crash\*" gui-screens/ -Force -ErrorAction SilentlyContinue }
          if (Test-Path bin/64/crash-report.txt) { Copy-Item bin/64/crash-report.txt gui-screens/ -Force; Get-Content bin/64/crash-report.txt }
          else { Write-Host 'no crash-report.txt (no SEH exception this run)' }

      # composite GUI chain G-1/G-2: drive the shell on the runner desktop
      # (SAC-free) — one screenshot per rail page + search + theme paths;
      # the PNGs are the acceptance evidence read by the implementer
      - name: GUI testdrive (shell screenshots)
        if: always()
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/gui-testdrive.ps1 -ExePath "bin/64/simplewall.exe" -OutDir "gui-screens"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            exe-hash.txt
            smoke-result.txt
            preflight.json
            smoke-artifacts/
            gui-screens/
            dumps/
            bin/64/simplewall.pdb
            bin/64/simplewall.exe

      - name: Verdict
        shell: pwsh
        run: |
          if (Test-Path smoke-result.txt) {
            Get-Content smoke-result.txt
            if ((Get-Content smoke-result.txt) -match 'FAIL') { exit 1 }
          }
