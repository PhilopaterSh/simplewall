name: smoke-test

# Hardened fork verification: build + launch + lifetime check
# Runs on push to feat branches (windows runner = admin, no UAC, no SAC)

on:
  push:
    branches: [feat/routine-hardening, feat/hardening-round-1, master, feat/tooling]
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # process gates (process-audit roadmap items 1-2): mechanical
      # traceability (goldfish check) + artifact completeness for every
      # spec chain — a chain that passes while carrying template files or
      # missing verification records must fail CI, not rely on discipline
      - name: Chain gates (goldfish check + artifact completeness)
        shell: pwsh
        run: |
          pip install tools/vendor/goldfish-gate-pin
          $failed = $false
          Get-ChildItem docs/specs -Directory | Where-Object { Test-Path "$($_.FullName)/design.md" } | ForEach-Object {
            Push-Location $_.FullName
            goldfish check design.md spec.md plan.md tasks.md
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Pop-Location
          }
          python tools/check-chain-artifacts.py docs/specs
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { Write-Error 'chain gates failed'; exit 1 }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore CppWinRT
        shell: cmd
        run: |
          curl -L -o nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
          nuget.exe install Microsoft.Windows.CppWinRT -Version 2.0.230706.1 -OutputDirectory packages -NonInteractive -Source https://api.nuget.org/v3/index.json

      - name: Build (Release x64)
        shell: cmd
        run: msbuild simplewall.vcxproj -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -p:WindowsTargetPlatformVersion=10.0 -p:TreatWarningAsError=false -m -nologo -v:m

      # tooling round r3 (DEC-08/DEC-10): build the C tool suite - no
      # NuGet needed (no CppWinRT coupling), same v143 override
      - name: Build tool suite (Release x64)
        shell: cmd
        run: |
          msbuild tools\preflight.vcxproj -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -p:WindowsTargetPlatformVersion=10.0 -p:TreatWarningAsError=false -m -nologo -v:m
          msbuild tools\dnsrig.vcxproj -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -p:WindowsTargetPlatformVersion=10.0 -p:TreatWarningAsError=false -m -nologo -v:m
          msbuild tools\feedserver.vcxproj -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -p:WindowsTargetPlatformVersion=10.0 -p:TreatWarningAsError=false -m -nologo -v:m

      - name: Verify exe exists
        shell: pwsh
        run: |
          $exe = 'bin/64/simplewall.exe'
          if (-not (Test-Path $exe)) { Write-Error 'exe missing'; exit 1 }
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "exe OK: $((Get-Item $exe).Length) bytes, SHA256=$h"
          "sha256=$h" | Out-File -Encoding utf8 exe-hash.txt

      - name: Smoke test - launch and lifetime
        shell: pwsh
        run: |
          # runners run elevated: WFP app launches without relaunch
          $p = Start-Process -FilePath 'bin/64/simplewall.exe' -PassThru
          Start-Sleep 20
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if ($alive) {
            Write-Host "PASS: simplewall alive after 20s (PID $($p.Id))"
            "result=PASS" | Out-File -Encoding utf8 smoke-result.txt
          } else {
            Write-Host "FAIL: simplewall exited within 20s (exit code 0x$($p.ExitCode.ToString('X')))"
            "result=FAIL" | Out-File -Encoding utf8 smoke-result.txt
          }

      - name: Smoke test - config and log collection
        shell: pwsh
        run: |
          Start-Sleep 5
          $dirs = @("$env:APPDATA\simplewall", "$env:LOCALAPPDATA\simplewall", "$env:USERPROFILE\Desktop\simplewall_crash")
          $out = 'smoke-artifacts'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          foreach ($d in $dirs) {
            if (Test-Path $d) { Copy-Item $d -Destination "$out/$(Split-Path $d -Leaf)" -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-ChildItem $out -Recurse | Select-Object FullName, Length | Out-File -Encoding utf8 "$out/inventory.txt"

      - name: Stop app
        if: always()
        shell: pwsh
        run: Stop-Process -Name simplewall -Force -ErrorAction SilentlyContinue

      # tooling round (FR-05): REQUIRED preflight gate — CI profile skips the
      # release-authoritative checks (Authenticode: runner builds are unsigned;
      # off-repo key JSON: never leaves the owner machine — DEC-05/DEC-07)
      - name: Release preflight (CI profile, C tool)
        shell: pwsh
        run: bin/64/preflight.exe bin/64/simplewall.exe --ci --json | Tee-Object -FilePath preflight.json

      # tooling round (FR-04): DNS rig loopback self-test — no sandbox needed
      - name: DNS rig self-test (C tool)
        shell: pwsh
        run: bin/64/dnsrig.exe -selftest

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            exe-hash.txt
            smoke-result.txt
            preflight.json
            smoke-artifacts/

      - name: Verdict
        shell: pwsh
        run: |
          if (Test-Path smoke-result.txt) {
            Get-Content smoke-result.txt
            if ((Get-Content smoke-result.txt) -match 'FAIL') { exit 1 }
          }
